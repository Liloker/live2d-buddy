name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests
        run: node tests/core.test.cjs

      - name: Build universal app
        run: ARCHS="arm64 x86_64" scripts/build.sh

      - name: Package
        run: |
          ditto -c -k --keepParent "build/Live2D Buddy.app" Live2D-Buddy-macOS.zip
          shasum -a 256 Live2D-Buddy-macOS.zip | tee Live2D-Buddy-macOS.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Live2D-Buddy-macOS.zip Live2D-Buddy-macOS.zip.sha256 \
            --title "Live2D Buddy $GITHUB_REF_NAME" --notes-file .github/release-notes.md
